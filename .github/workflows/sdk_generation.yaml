name: Generate
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  workflow_dispatch:
    inputs:
      force:
        description: Force generation of SDKs
        type: boolean
        default: false
      set_version:
        description: Optionally set a specific SDK version
        type: string
  schedule:
    - cron: 0 0 * * *
  pull_request:
    types:
      - labeled
      - unlabeled
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - uses: dagger/dagger-for-github@8.0.0

      - name: Generate SDK
        run: |
          uv run python ci/pipeline.py generate \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }} \
            ${{ github.event.inputs.set_version && format('--version {0}', github.event.inputs.set_version) || '' }}
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAGGER_PROGRESS: plain
          OTEL_SDK_DISABLED: "true"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: gha/attio-sdk-generation
          base: main
          commit-message: "feat(sdk): regenerate attio SDK"
          labels: automated, sdk
          delete-branch: true

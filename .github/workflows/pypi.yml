name: Publish to PyPI

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DAGGER_PROGRESS: plain
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - uses: dagger/dagger-for-github@v8.4.1

      - name: Verify tag matches package versions
        if: github.ref_type == 'tag'
        run: uv run python ci/pipeline.py verify-version "${GITHUB_REF_NAME#v}"

      - name: Run tests
        run: uv run python ci/pipeline.py test

      - name: Build distribution
        run: uv run python ci/pipeline.py build

      - name: Debug PYPI_TOKEN length
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: echo "PYPI_TOKEN length=${#PYPI_TOKEN}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
